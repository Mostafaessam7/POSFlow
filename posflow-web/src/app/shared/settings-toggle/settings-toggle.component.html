<div class="settings-toggle">
  <button
    type="button"
    class="toggle-btn"
    [attr.aria-label]="(themeService.theme() === 'dark' ? 'التبديل للوضع الفاتح' : 'التبديل للوضع الداكن') | t"
    (click)="toggleTheme()">

    @if (themeService.theme() === 'dark') {
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="4"></circle>
        <line x1="12" y1="2" x2="12" y2="4.5"></line>
        <line x1="12" y1="19.5" x2="12" y2="22"></line>
        <line x1="4.22" y1="4.22" x2="5.99" y2="5.99"></line>
        <line x1="18.01" y1="18.01" x2="19.78" y2="19.78"></line>
        <line x1="2" y1="12" x2="4.5" y2="12"></line>
        <line x1="19.5" y1="12" x2="22" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.99" y2="18.01"></line>
        <line x1="18.01" y1="5.99" x2="19.78" y2="4.22"></line>
      </svg>
    } @else {
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.6A9 9 0 1 1 11.4 3a7 7 0 0 0 9.6 9.6Z"></path>
      </svg>
    }
  </button>

  <button
    type="button"
    class="toggle-btn lang-btn"
    aria-label="Switch language"
    (click)="toggleLang()">
    {{ translationService.lang() === 'ar' ? 'EN' : 'AR' }}
  </button>
</div>
