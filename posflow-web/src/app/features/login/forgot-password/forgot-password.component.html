<div class="login-page" dir="rtl">
  <div class="login-card">
    <div class="brand">
      <h1>PosFlow</h1>
      <p>استرجاع كلمة المرور</p>
    </div>

    @if (isSubmitted) {
      <div class="success-message">
        لو الحساب موجود وعليه إيميل مسجّل، هيوصلك رابط إعادة تعيين كلمة
        المرور خلال دقايق.
      </div>

      <button type="button" (click)="goToLogin()">
        رجوع لتسجيل الدخول
      </button>
    } @else {
      @if (errorMessage) {
        <div class="api-error">{{ errorMessage }}</div>
      }

      <form [formGroup]="form" (ngSubmit)="submit()">
        <div class="form-group">
          <label for="username">اسم المستخدم</label>
          <input id="username" type="text" formControlName="username" autofocus />

          @if (
            form.controls.username.touched &&
            form.controls.username.invalid
          ) {
            <span class="validation-error">اسم المستخدم مطلوب</span>
          }
        </div>

        <button type="submit" [disabled]="isSubmitting">
          @if (isSubmitting) {
            <span class="spinner" aria-hidden="true"></span>
            جاري الإرسال...
          } @else {
            إرسال رابط إعادة التعيين
          }
        </button>
      </form>

      <button class="text-button" type="button" (click)="goToLogin()">
        رجوع لتسجيل الدخول
      </button>
    }
  </div>
</div>
