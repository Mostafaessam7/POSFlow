name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore PosFlow.slnx

      - name: Build
        run: dotnet build PosFlow.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test PosFlow.slnx --no-build --configuration Release --verbosity normal

      - name: Check for known-vulnerable NuGet packages
        # `dotnet list package --vulnerable` exits 0 even when it finds
        # something, so the output has to be inspected to actually gate the
        # build - otherwise this step is decorative. Mirrors the frontend's
        # `npm audit --audit-level=high` below: fails on High/Critical only,
        # so a low/moderate transitive advisory doesn't block every PR.
        run: |
          dotnet list PosFlow.slnx package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          if grep -qE '\s(High|Critical)\s' vuln.txt; then
            echo "::error::High or Critical severity NuGet vulnerability found (see the table above)."
            exit 1
          fi
          echo "No High/Critical NuGet vulnerabilities found."

  frontend:
    name: Frontend (build + test)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: posflow-web

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: posflow-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test -- --watch=false

      - name: Build
        run: npm run build -- --configuration production

      - name: Audit dependencies for known vulnerabilities
        # --audit-level=high: fails the build on High/Critical findings
        # without blocking on every low-severity transitive advisory.
        # Tighten this once the project has a process to triage lower
        # severities regularly.
        # npm audit exits non-zero for two unrelated reasons: it found an advisory, or it could
        # not reach the registry at all. Treating those alike makes an npm outage look like a
        # security finding -- on 2026-09-04 a burst of 503s from the audit endpoint failed five
        # unrelated dependency PRs across these repos, and a red check that actually means "npm
        # was down" is how a gate gets muted. So retry the transport, fail hard on a real
        # finding, and if the registry stays unreachable say plainly that the audit did not run.
        run: |
          for attempt in 1 2 3; do
            if out=$(npm audit --audit-level=high 2>&1); then
              echo "$out"
              echo "No High/Critical advisories."
              exit 0
            fi

            if printf '%s' "$out" | grep -qiE 'audit endpoint returned an error|Service Unavailable|ENOTFOUND|ETIMEDOUT|EAI_AGAIN|ECONNRESET|socket hang up'; then
              echo "Could not reach the npm registry (attempt $attempt of 3)."
              sleep $((attempt * 15))
              continue
            fi

            echo "$out"
            echo "::error::npm audit found a High or Critical advisory."
            exit 1
          done

          echo "$out"
          echo "::warning::npm audit could not reach the npm registry after 3 attempts, so dependencies were NOT audited in this run. This is a transport failure, not a clean result."

  docker-build:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [ backend, frontend ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build API image
        run: docker build -f src/PosFlow.Api/Dockerfile -t posflow-api:ci .

      - name: Build web image
        run: docker build -t posflow-web:ci ./posflow-web

  # Publishes both images to GitHub Container Registry on every push to
  # main, tagged with the commit SHA and 'latest'. This is CI/CD as far
  # as this repo can take it on its own - GHCR needs no extra account
  # or cloud choice (it's part of the repo's own GitHub org). Getting
  # an image from here onto a running server (Azure/AWS/a VM/k8s) is
  # the part that genuinely needs you to pick a hosting target first -
  # see deploy/README.md. Once you have one, add a `deploy` job here
  # that pulls ghcr.io/<org>/posflow-api:latest and
  # ghcr.io/<org>/posflow-web:latest onto it.
  publish-images:
    name: Publish images to GHCR
    runs-on: ubuntu-latest
    needs: [ docker-build ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR rejects any tag whose repository name is not lowercase, and
      # github.repository_owner preserves the account's actual casing
      # ("Mostafaessam7"). Every push failed with:
      #   invalid tag "ghcr.io/Mostafaessam7/posflow-api:latest":
      #   repository name must be lowercase
      # There is no built-in lowercase filter in workflow expressions, so it is
      # done here once and reused by both image builds below.
      - name: Lowercase the image owner
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/PosFlow.Api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/posflow-api:latest
            ghcr.io/${{ env.IMAGE_OWNER }}/posflow-api:${{ github.sha }}

      - name: Build and push web image
        uses: docker/build-push-action@v7
        with:
          context: ./posflow-web
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/posflow-web:latest
            ghcr.io/${{ env.IMAGE_OWNER }}/posflow-web:${{ github.sha }}

  # No deploy-to-a-running-server job yet - that needs a real hosting
  # target chosen first (Azure App Service, ECS, a VM, k8s, ...). See
  # deploy/README.md for what a production deploy needs to do
  # (migrations as an explicit step, real secrets, etc.).
