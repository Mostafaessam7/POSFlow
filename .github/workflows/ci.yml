name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore PosFlow.slnx

      - name: Build
        run: dotnet build PosFlow.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test PosFlow.slnx --no-build --configuration Release --verbosity normal

      - name: Check for known-vulnerable NuGet packages
        run: dotnet list PosFlow.slnx package --vulnerable --include-transitive

  frontend:
    name: Frontend (build + test)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: posflow-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: posflow-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test -- --watch=false

      - name: Build
        run: npm run build -- --configuration production

      - name: Audit dependencies for known vulnerabilities
        # --audit-level=high: fails the build on High/Critical findings
        # without blocking on every low-severity transitive advisory.
        # Tighten this once the project has a process to triage lower
        # severities regularly.
        run: npm audit --audit-level=high

  docker-build:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [ backend, frontend ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f src/PosFlow.Api/Dockerfile -t posflow-api:ci .

      - name: Build web image
        run: docker build -t posflow-web:ci ./posflow-web

  # Publishes both images to GitHub Container Registry on every push to
  # main, tagged with the commit SHA and 'latest'. This is CI/CD as far
  # as this repo can take it on its own - GHCR needs no extra account
  # or cloud choice (it's part of the repo's own GitHub org). Getting
  # an image from here onto a running server (Azure/AWS/a VM/k8s) is
  # the part that genuinely needs you to pick a hosting target first -
  # see deploy/README.md. Once you have one, add a `deploy` job here
  # that pulls ghcr.io/<org>/posflow-api:latest and
  # ghcr.io/<org>/posflow-web:latest onto it.
  publish-images:
    name: Publish images to GHCR
    runs-on: ubuntu-latest
    needs: [ docker-build ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/PosFlow.Api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/posflow-api:latest
            ghcr.io/${{ github.repository_owner }}/posflow-api:${{ github.sha }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: ./posflow-web
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/posflow-web:latest
            ghcr.io/${{ github.repository_owner }}/posflow-web:${{ github.sha }}

  # No deploy-to-a-running-server job yet - that needs a real hosting
  # target chosen first (Azure App Service, ECS, a VM, k8s, ...). See
  # deploy/README.md for what a production deploy needs to do
  # (migrations as an explicit step, real secrets, etc.).
