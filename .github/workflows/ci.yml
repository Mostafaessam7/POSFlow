name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore PosFlow.slnx

      - name: Build
        run: dotnet build PosFlow.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test PosFlow.slnx --no-build --configuration Release --verbosity normal

      - name: Check for known-vulnerable NuGet packages
        run: dotnet list PosFlow.slnx package --vulnerable --include-transitive

  frontend:
    name: Frontend (build + test)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: posflow-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: posflow-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test -- --watch=false

      - name: Build
        run: npm run build -- --configuration production

      - name: Audit dependencies for known vulnerabilities
        # --audit-level=high: fails the build on High/Critical findings
        # without blocking on every low-severity transitive advisory.
        # Tighten this once the project has a process to triage lower
        # severities regularly.
        run: npm audit --audit-level=high

  docker-build:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [ backend, frontend ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f src/PosFlow.Api/Dockerfile -t posflow-api:ci .

      - name: Build web image
        run: docker build -t posflow-web:ci ./posflow-web

  # No deploy job yet - wire this up once there's a real hosting target
  # (Azure App Service, ECS, a VM, etc.). See deploy/README.md for what
  # a production deploy needs to do (migrations as an explicit step,
  # real secrets, etc.) before adding one here.
