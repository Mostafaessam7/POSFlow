name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore PosFlow.slnx

      - name: Build
        run: dotnet build PosFlow.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test PosFlow.slnx --no-build --configuration Release --verbosity normal

  frontend:
    name: Frontend (build + test)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: posflow-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: posflow-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        # Adjust flags here if your Angular version's test runner
        # needs different ones (e.g. --browsers=ChromeHeadless for a
        # Karma-based setup).
        run: npm test -- --watch=false

      - name: Build
        run: npm run build
